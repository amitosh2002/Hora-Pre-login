<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" role="img" aria-label="Code Review and Policy Gate Illustration">
  <defs>
    <linearGradient id="fsbRevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="450" cy="535" rx="360" ry="22" fill="#e2e8f0" opacity="0.6" />

  <!-- Desk Surface -->
  <rect x="120" y="440" width="660" height="18" rx="6" fill="#cbd5e1" />
  <rect x="220" y="458" width="18" height="80" fill="#94a3b8" />
  <rect x="660" y="458" width="18" height="80" fill="#94a3b8" />

  <!-- Big Workstation Monitor (Code Review Screen) -->
  <g class="fsb-illu-monitor" transform="translate(160, 120)">
    <!-- Stand -->
    <rect x="175" y="300" width="30" height="40" fill="#64748b" />
    <path d="M 140 335 L 240 335 L 250 345 L 130 345 Z" fill="#475569" />

    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="380" height="300" rx="14" fill="#0f172a" filter="drop-shadow(0 14px 28px rgba(15, 23, 42, 0.15))" />
    <rect x="10" y="10" width="360" height="280" rx="8" fill="#1e1b4b" />

    <!-- Code Editor Header -->
    <rect x="10" y="10" width="360" height="34" rx="8" fill="#2e1065" />
    <circle cx="28" cy="27" r="4.5" fill="#f87171" />
    <circle cx="44" cy="27" r="4.5" fill="#fbbf24" />
    <circle cx="60" cy="27" r="4.5" fill="#34d399" />
    <rect x="80" y="20" width="100" height="14" rx="4" fill="#4c1d95" />
    <text x="90" y="31" font-size="9" font-family="monospace" fill="#c4b5fd">PR-142_diff.js</text>

    <!-- Code Diff Lines -->
    <g transform="translate(24, 60)" font-family="monospace" font-size="11">
      <!-- Added lines (Green) -->
      <rect x="0" y="0" width="332" height="20" rx="3" fill="#064e3b" opacity="0.6" />
      <text x="8" y="14" fill="#34d399">+ export const retryWebhook = async (req) =&gt; {</text>

      <rect x="0" y="24" width="332" height="20" rx="3" fill="#064e3b" opacity="0.6" />
      <text x="8" y="38" fill="#34d399">+   const backoff = Math.pow(2, attempt) * 100;</text>

      <!-- Unchanged lines -->
      <text x="8" y="62" fill="#94a3b8">    const status = await dispatch(req);</text>
      <text x="8" y="84" fill="#94a3b8">    if (status.ok) return finalize();</text>

      <!-- Removed line (Red) -->
      <rect x="0" y="94" width="332" height="20" rx="3" fill="#7f1d1d" opacity="0.6" />
      <text x="8" y="108" fill="#f87171">-   throw new Error("Delivery dropped");</text>

      <!-- Added line -->
      <rect x="0" y="118" width="332" height="20" rx="3" fill="#064e3b" opacity="0.6" />
      <text x="8" y="132" fill="#34d399">+   return scheduleRetry(req, backoff);</text>
    </g>

    <!-- Policy Inspection Stamp -->
    <g transform="translate(190, 205)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#10b981" />
      <circle cx="24" cy="21" r="12" fill="#ffffff" />
      <path d="M 18 21 L 22 25 L 30 17" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
      <text x="44" y="20" font-size="11" font-weight="700" fill="#ffffff">POLICY GATE</text>
      <text x="44" y="32" font-size="9" font-weight="500" fill="#d1fae5">ALL 3 CHECKS PASS</text>
    </g>
  </g>

  <!-- Reviewer Character (unDraw aesthetic) sitting/standing -->
  <g class="fsb-illu-reviewer" transform="translate(560, 150)">
    <!-- Chair back -->
    <path d="M 190 220 L 210 380 L 170 380 Z" fill="#334155" />
    <rect x="180" y="180" width="30" height="150" rx="10" fill="#475569" />

    <!-- Legs sitting -->
    <path d="M 80 340 L 40 370 L -10 370 L -20 420 L 40 420 L 100 370 Z" fill="#1e1b4b" />
    <path d="M 100 340 L 70 390 L 10 390 L 0 440 L 60 440 L 120 380 Z" fill="#2f2e41" />
    <!-- Shoes -->
    <path d="M -30 420 Q -10 415 10 420 Q 10 432 -30 432 Z" fill="#090814" />
    <path d="M -10 440 Q 10 435 30 440 Q 30 452 -10 452 Z" fill="#090814" />

    <!-- Torso -->
    <path d="M 85 190 Q 130 180 160 190 L 150 330 Q 110 340 75 330 Z" fill="url(#fsbRevGrad)" />

    <!-- Neck & Head -->
    <rect x="110" y="160" width="18" height="24" fill="#ffb6b6" rx="4" />
    <ellipse cx="118" cy="130" rx="26" ry="28" fill="#ffb6b6" />

    <!-- Hair -->
    <path d="M 94 130 C 90 95 125 75 145 95 C 150 110 148 135 140 145 C 135 115 130 105 112 105 C 102 105 98 115 94 130 Z" fill="#090814" />

    <!-- Glasses (unDraw smart review detail) -->
    <rect x="98" y="124" width="16" height="10" rx="2" fill="none" stroke="#1e1b4b" stroke-width="2" />
    <rect x="118" y="124" width="16" height="10" rx="2" fill="none" stroke="#1e1b4b" stroke-width="2" />
    <line x1="114" y1="129" x2="118" y2="129" stroke="#1e1b4b" stroke-width="2" />

    <!-- Left Arm leaning on desk with coffee/notepad -->
    <path d="M 90 200 Q 10 230 -40 280 L 10 290 Q 50 250 105 220 Z" fill="#7c3aed" />
    <circle cx="-42" cy="285" r="9" fill="#ffb6b6" />

    <!-- Coffee mug on desk -->
    <rect x="-70" y="270" width="22" height="26" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <path d="M -48 275 Q -40 283 -48 291" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <path d="M -64 264 Q -62 258 -64 252" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Floating Ticket Card & Review Badges -->
  <g class="fsb-illu-float-badges" transform="translate(680, 80)">
    <rect x="0" y="0" width="140" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.06))" />
    <rect x="12" y="12" width="60" height="16" rx="4" fill="#ede9fe" />
    <text x="18" y="24" font-size="10" font-weight="700" fill="#7c3aed">HOR-214</text>
    <text x="12" y="44" font-size="11" font-weight="600" fill="#0f172a">Retry Webhooks</text>
    <circle cx="20" cy="62" r="5" fill="#10b981" />
    <text x="30" y="65" font-size="10" fill="#64748b">Ready to merge</text>
  </g>
</svg>
