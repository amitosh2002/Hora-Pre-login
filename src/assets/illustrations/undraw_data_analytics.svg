<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" role="img" aria-label="Data Analytics and Scoring Illustration">
  <defs>
    <linearGradient id="fsbAnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="fsbAnaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>
    <filter id="fsbAnaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="450" cy="540" rx="360" ry="22" fill="#e2e8f0" opacity="0.6" />

  <!-- Analytics Dashboard Board / Screen -->
  <g class="fsb-illu-board" transform="translate(140, 110)">
    <!-- Main screen frame -->
    <rect x="0" y="0" width="460" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="drop-shadow(0 12px 24px rgba(124, 58, 237, 0.08))" />
    
    <!-- Top window header -->
    <rect x="0" y="0" width="460" height="38" rx="16" fill="#f8fafc" />
    <line x1="0" y1="38" x2="460" y2="38" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="24" cy="19" r="5" fill="#f87171" />
    <circle cx="42" cy="19" r="5" fill="#fbbf24" />
    <circle cx="60" cy="19" r="5" fill="#34d399" />
    <rect x="160" y="12" width="140" height="14" rx="7" fill="#ede9fe" />

    <!-- Chart grid lines -->
    <line x1="40" y1="90" x2="420" y2="90" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="40" y1="140" x2="420" y2="140" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="40" y1="190" x2="420" y2="190" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="40" y1="240" x2="420" y2="240" stroke="#e2e8f0" stroke-width="2" />

    <!-- Chart Area Wave -->
    <path d="M 50 240 L 50 180 Q 110 130 160 160 T 260 110 T 360 80 T 410 70 L 410 240 Z" fill="url(#fsbAnaGrad2)" />
    <path d="M 50 180 Q 110 130 160 160 T 260 110 T 360 80 T 410 70" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" />

    <!-- Bar chart elements with live fill look -->
    <rect x="70" y="160" width="18" height="80" rx="4" fill="#c4b5fd" />
    <rect x="120" y="130" width="18" height="110" rx="4" fill="#a78bfa" />
    <rect x="170" y="150" width="18" height="90" rx="4" fill="#c4b5fd" />
    <rect x="220" y="100" width="18" height="140" rx="4" fill="#8b5cf6" />
    <rect x="270" y="120" width="18" height="120" rx="4" fill="#a78bfa" />
    <rect x="320" y="80" width="18" height="160" rx="4" fill="#7c3aed" />
    <rect x="370" y="65" width="18" height="175" rx="4" fill="url(#fsbAnaGrad1)" />

    <!-- Data metric tags -->
    <g transform="translate(40, 260)">
      <rect x="0" y="0" width="90" height="38" rx="8" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1" />
      <text x="12" y="18" font-size="10" font-weight="600" fill="#6b21a8">FACTOR SCORE</text>
      <text x="12" y="32" font-size="14" font-weight="800" fill="#7c3aed">92.4%</text>

      <rect x="110" y="0" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="122" y="18" font-size="10" font-weight="600" fill="#15803d">CONFIDENCE</text>
      <text x="122" y="32" font-size="14" font-weight="800" fill="#16a34a">96.0%</text>

      <rect x="220" y="0" width="110" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="232" y="18" font-size="10" font-weight="600" fill="#1e40af">SPRINT CAP</text>
      <text x="232" y="32" font-size="14" font-weight="800" fill="#2563eb">ELIGIBLE</text>
    </g>
  </g>

  <!-- Floating algorithm calculation badge -->
  <g class="fsb-illu-float-calc" transform="translate(80, 80)">
    <rect x="0" y="0" width="130" height="74" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(124, 58, 237, 0.12))" />
    <circle cx="24" cy="24" r="12" fill="#ede9fe" />
    <path d="M 19 24 L 23 28 L 30 20" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" />
    <text x="44" y="22" font-size="11" font-weight="700" fill="#1e1b4b">6-Factor</text>
    <text x="44" y="34" font-size="9" fill="#64748b">Weighted Alg</text>
    <rect x="12" y="48" width="106" height="8" rx="4" fill="#ede9fe" />
    <rect x="12" y="48" width="86" height="8" rx="4" fill="#7c3aed" />
  </g>

  <!-- Developer Analyst Figure (unDraw style character) -->
  <g class="fsb-illu-char" transform="translate(560, 160)">
    <!-- Legs -->
    <path d="M 90 280 L 70 380 L 100 380 L 115 280 Z" fill="#2f2e41" />
    <path d="M 130 280 L 145 380 L 175 380 L 155 280 Z" fill="#1e1b4b" />
    <!-- Shoes -->
    <path d="M 60 380 Q 75 375 105 380 Q 105 390 60 390 Z" fill="#090814" />
    <path d="M 135 380 Q 150 375 180 380 Q 180 390 135 390 Z" fill="#090814" />

    <!-- Torso / Jacket -->
    <path d="M 75 160 Q 120 150 165 160 L 155 290 Q 120 300 85 290 Z" fill="#6c63ff" />
    <path d="M 105 160 L 120 230 L 135 160 Z" fill="#ffffff" />
    <path d="M 118 190 L 122 250" stroke="#7c3aed" stroke-width="3" />

    <!-- Neck & Head -->
    <rect x="110" y="135" width="20" height="25" fill="#ed9da0" rx="4" />
    <ellipse cx="120" cy="110" rx="26" ry="30" fill="#ed9da0" />

    <!-- Hair -->
    <path d="M 94 110 C 90 80 120 65 145 80 C 152 90 150 115 145 125 C 140 100 135 90 115 90 C 105 90 100 100 94 110 Z" fill="#2f2e41" />

    <!-- Left Arm pointing at screen -->
    <path d="M 80 170 Q 20 200 -20 180" fill="none" stroke="#6c63ff" stroke-width="16" stroke-linecap="round" />
    <circle cx="-24" cy="178" r="8" fill="#ed9da0" />

    <!-- Right Arm holding tablet -->
    <path d="M 160 170 Q 190 220 150 240" fill="none" stroke="#6c63ff" stroke-width="16" stroke-linecap="round" />
    <!-- Tablet -->
    <rect x="125" y="215" width="46" height="32" rx="4" fill="#090814" transform="rotate(-15 125 215)" />
    <rect x="128" y="218" width="40" height="26" rx="2" fill="#ede9fe" transform="rotate(-15 125 215)" />
  </g>

  <!-- Floating Sparkles / Data Nodes -->
  <g class="fsb-illu-nodes">
    <circle cx="110" cy="220" r="6" fill="#8b5cf6" opacity="0.8" />
    <circle cx="125" cy="400" r="5" fill="#c4b5fd" opacity="0.7" />
    <circle cx="690" cy="90" r="7" fill="#7c3aed" opacity="0.6" />
    <circle cx="750" cy="280" r="5" fill="#a78bfa" opacity="0.8" />
    <polygon points="640,70 644,78 652,80 646,86 648,94 640,90 632,94 634,86 628,80 636,78" fill="#fbbf24" />
  </g>
</svg>
